<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--accent:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a4a;touch-action:none;overscroll-behavior:none;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg{width:1em;height:1em;fill:currentColor;vertical-align:-0.12em}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 14px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:6}
.rgrp{display:flex;gap:8px}
.ibtn.off{opacity:.55}
body.menu #hud .scorebox,body.menu #homeBtn{visibility:hidden}
#hud button{pointer-events:auto}
.ibtn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .1s}
.ibtn:active{transform:scale(.9)}
.scorebox{text-align:center;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
#best{font-size:15px;font-weight:800;opacity:.9;display:flex;gap:5px;align-items:center;justify-content:center}
#best svg{color:var(--accent)}
#score{font-size:44px;font-weight:900;letter-spacing:.5px;margin-top:2px;display:inline-block;transition:transform .08s}
#score.bump{transform:scale(1.18)}
#modeTag{font-size:11px;font-weight:900;letter-spacing:2px;opacity:.85;margin-top:3px;min-height:12px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;padding:20px;
  background:rgba(20,8,40,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.card{width:min(380px,100%);text-align:center;transform:translateY(20px) scale(.96);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.overlay.show .card{transform:none}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
.pvlink{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:#fff;opacity:.55;text-decoration:none;padding:4px 10px;pointer-events:auto}.pvlink:hover{opacity:.9;text-decoration:underline}
#oReason{font-size:15px;font-weight:900;opacity:.85;margin:2px 0 4px;letter-spacing:.3px}#oReason.time{color:#ffb3c1;opacity:1}
.tagline{font-size:15px;font-weight:800;opacity:.92;margin:0 0 18px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.logo .row{display:flex;gap:5px}
.logo .tile{width:44px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.25);animation:bob 2.4s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:76px;border-radius:24px;font-size:30px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(#5dff8a,#1fc45a);box-shadow:0 7px 0 #128a3c,0 14px 24px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;animation:pulse 1.6s ease-in-out infinite}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #128a3c}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.04}}
.subbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 16px;border-radius:20px;background:rgba(255,255,255,.16);box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:left;transition:transform .08s}
.subbtn:active{transform:translateY(3px)}
.subbtn .ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.subbtn .t1{font-size:19px;font-weight:900}
.subbtn .t2{font-size:13px;font-weight:700;opacity:.85;display:flex;gap:8px;align-items:center;margin-top:3px}
.flame{color:#ffb020}
.stars{color:#ffd60a;letter-spacing:2px}
.stars .off{color:rgba(255,255,255,.3)}
.row3{display:flex;gap:12px;margin-top:16px}
.row3 .ibtn{flex:1;height:58px;font-size:26px}
.lbl{font-size:13px;font-weight:900;letter-spacing:3px;opacity:.8}
#oScore{font-size:68px;font-weight:900;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.2)}
#oBest{font-size:18px;font-weight:800;display:flex;gap:6px;align-items:center;justify-content:center}
#oBest svg{color:var(--accent)}
.ribbon{display:inline-block;margin-bottom:10px;padding:8px 18px;border-radius:12px;background:linear-gradient(#ffe45c,#ffb800);color:#6b3b00;font-weight:900;font-size:20px;letter-spacing:1px;box-shadow:0 4px 0 #b77d00;animation:wig 1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.08)}}
.bar{position:relative;height:16px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#ffd60a,#ff7b00);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.xp i{background:linear-gradient(90deg,#5ee7ff,#7b61ff)}
.metaRow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-top:14px;opacity:.95}
.sw{display:inline-flex;gap:2px;vertical-align:middle}
.sw b{width:10px;height:10px;border-radius:3px;display:inline-block}
#replay{margin-top:22px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.theme{position:relative;height:96px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s}
.theme:active{transform:scale(.95)}
.theme.sel{outline:4px solid #fff;outline-offset:-4px}
.theme.locked .sw,.theme.locked span.n{opacity:.35}
.theme .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.35);font-size:13px;gap:4px}
.theme .lk svg{font-size:24px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translate(-50%,40px);opacity:0;z-index:9;padding:12px 20px;border-radius:16px;background:rgba(20,10,40,.85);font-weight:900;font-size:16px;transition:all .35s cubic-bezier(.2,1.5,.4,1);pointer-events:none;display:flex;gap:10px;align-items:center;white-space:nowrap}
#toast.show{transform:translate(-50%,0);opacity:1}
h2{margin:0 0 4px;font-size:28px;font-weight:900}
#swapBtn{position:fixed;z-index:3;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#5ee7ff calc(var(--p,0)*1%),rgba(255,255,255,.2) 0);box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s}
#swapBtn::before{content:'';position:absolute;inset:6px;border-radius:50%;background:linear-gradient(#8f7bff,#5a3fd6);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:background .2s}
#swapBtn svg{position:relative;font-size:28px}
#swapBtn b{position:absolute;right:-5px;top:-5px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#ffd60a;color:#5a3800;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#swapBtn.empty::before{background:linear-gradient(#9a96b6,#6d6990)}
#swapBtn.empty b{background:#ddd;color:#666}
#swapBtn.armed{transform:scale(1.14)}
#swapBtn.armed::before{background:linear-gradient(#ffd60a,#ff9f1c)}
#swapBtn.pulse{animation:spulse .8s ease-in-out infinite}
@keyframes spulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #ffd60a)}50%{transform:scale(1.2);filter:drop-shadow(0 0 14px #ffd60a)}}
#stuckP{position:fixed;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:22px;
  background:rgba(40,16,80,.78);color:#fff;font-weight:900;text-align:center;cursor:pointer;border:3px solid #ffd60a;
  box-shadow:0 0 0 5px rgba(255,214,10,.22),0 12px 30px rgba(0,0,0,.35);font:inherit;font-weight:900}
#stuckP.show{display:flex;animation:spIn .4s cubic-bezier(.2,1.6,.4,1)}
#stuckP .s1{font-size:26px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#stuckP .s2{font-size:21px;color:#ffd60a;display:flex;align-items:center;gap:8px}
#stuckP .s2 svg{font-size:26px}
#stuckP .sbar{width:min(220px,70%);height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:2px}
#stuckP .sbar i{display:block;height:100%;width:100%;background:#ffd60a;border-radius:3px;transform-origin:left}
#stuckP.show .sbar i{animation:sbarK 2.9s linear forwards}
#stuckP .sarr{font-size:30px;color:#ffd60a;line-height:1;animation:sbob .6s ease-in-out infinite}
@keyframes sbarK{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes sbob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes spIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sbig{0%,100%{transform:scale(1.3);filter:drop-shadow(0 0 6px #ffd60a)}50%{transform:scale(1.5);filter:drop-shadow(0 0 24px #ffd60a)}}
body.stuck #swapBtn.pulse{animation:sbig .7s ease-in-out infinite;z-index:5}
body.menu #stuckP{display:none}
#swapBtn.pop{animation:spop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes spop{0%{transform:scale(.5) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
body.menu #swapBtn{visibility:hidden}
.skgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.skin{position:relative;height:84px;border-radius:16px;background:rgba(255,255,255,.16);box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:900}
.skin canvas{position:static;inset:auto;width:46px;height:46px}
.skin.sel{outline:3px solid #fff;outline-offset:-3px}
.skin .lk{position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:24px}
#themes .card,#over .card{max-height:100%;overflow:auto;scrollbar-width:none}
#chalCard{margin:0 0 16px;padding:16px 16px 18px;border-radius:24px;background:linear-gradient(135deg,rgba(255,214,10,.38),rgba(255,95,109,.42));border:3px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chTitle{font-size:20px;white-space:nowrap;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.overlay{padding-top:calc(var(--safe-t) + 64px)}
body.chal .logo .tile{width:36px;height:40px;font-size:24px;border-radius:9px}
body.chal .tagline{margin-bottom:12px;font-size:14px}
body.chal #chalCard{padding:12px 14px 14px}
.chTitle svg{font-size:20px}
.chText{font-size:17px;font-weight:800;margin:8px 0 4px;line-height:1.3}
.chText b{font-size:22px;color:#fff6a8}
.chSub{font-size:13px;font-weight:800;opacity:.85;margin-bottom:12px}
.bigbtn.gold{background:linear-gradient(#ffe45c,#ffb800);color:#5a3800;text-shadow:none;box-shadow:0 7px 0 #b77d00,0 14px 24px rgba(0,0,0,.25);font-size:26px;height:70px}
.bigbtn.gold:active{box-shadow:0 2px 0 #b77d00}
.bigbtn.secondary{height:58px;font-size:22px;animation:none;background:rgba(255,255,255,.2);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.row2{display:flex;gap:10px;margin-top:16px}
.lbtn{flex:1;min-height:58px;padding:8px 10px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:900;line-height:1.1;background:rgba(255,255,255,.2);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
.lbtn svg{font-size:22px;flex:none}
.lbtn:active{transform:translateY(3px)}
.lbtn.gold{background:linear-gradient(#ffe45c,#ffb800);color:#5a3800;box-shadow:0 5px 0 #b77d00}
#oChal{display:none;margin:10px 0 0;padding:10px;border-radius:14px;font-weight:900;font-size:20px}
#oChal.win{background:linear-gradient(#5dff8a,#1fc45a);box-shadow:0 4px 0 #128a3c}
#oChal.lose{background:rgba(0,0,0,.25)}
#bragImg{width:min(300px,68vw,calc((100vh - 190px)*.8));border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:block;margin:0 auto}
.heart{color:#ff4d6d}.heart.off{color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <button class="ibtn" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
  <div class="scorebox">
    <div id="best"><svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg><span id="bestV">0</span></div>
    <div id="score">0</div>
    <div id="modeTag"></div>
  </div>
  <div class="rgrp"><button class="ibtn" id="musicBtn" aria-label="Music"></button><button class="ibtn" id="muteBtn" aria-label="Sound effects"></button></div>
</div>

<div id="title" class="overlay show">
  <div class="card">
    <div class="logo" id="logo"></div>
    <div class="tagline">The block puzzle with zero ads. Just play.</div>
    <div id="chalCard" style="display:none">
      <div class="chTitle"><svg viewBox="0 0 24 24"><path d="M3 2h3l9 9-3 3-9-9zm18 0v3l-9 9-3-3 9-9zM5 15l4 4-2 2-1-1-2 2-2-2 2-2-1-1zm14 0 2 2-1 1 2 2-2 2-2-2-1 1-2-2z"/></svg> YOU'VE BEEN CHALLENGED!</div>
      <div class="chText" id="chalInfo"></div>
      <div class="chSub">Free · zero ads · no sign-up</div>
      <button class="bigbtn gold" id="chalBtn"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>PLAY CHALLENGE</button>
    </div>
    <button class="bigbtn" id="playBtn"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>PLAY</button>
    <button class="subbtn" id="dailyBtn">
      <div class="ic" style="background:linear-gradient(#ff8a5c,#ff4d6d)"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 7v11h12V9z"/><path d="M8 11h3v3H8z"/></svg></div>
      <div><div class="t1">DAILY <span id="dDate" style="opacity:.7;font-size:14px"></span></div><div class="t2" id="dInfo"></div></div>
    </button>
    <button class="subbtn" id="speedBtn">
      <div class="ic" style="background:linear-gradient(#ffd60a,#ff8a00)"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></div>
      <div><div class="t1">SPEED</div><div class="t2" id="sInfo"></div></div>
    </button>
    <button class="subbtn" id="themesBtn">
      <div class="ic" style="background:linear-gradient(#5ee7ff,#7b61ff)"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 10.8C22 5.9 17.5 2 12 2zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></div>
      <div style="flex:1"><div class="t1">THEMES <span id="tCount" style="opacity:.7;font-size:14px"></span></div><div class="bar xp" style="height:10px"><i id="tBar"></i></div></div>
    </button>
    <a class="pvlink" href="privacy.html">Privacy</a>
  </div>
</div>

<div id="over" class="overlay">
  <div class="card">
    <div id="oRibbon" class="ribbon" style="display:none">NEW BEST!</div>
    <div id="oReason"></div>
    <div class="lbl">SCORE</div>
    <div id="oScore">0</div>
    <div id="oBest"><svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg><span id="oBestV">0</span></div>
    <div id="oNear" style="margin-top:12px"><div class="bar"><i id="oNearBar"></i></div><div style="font-weight:900;font-size:15px;margin-top:6px" id="oNearTxt"></div></div>
    <div id="oChal"></div>
    <div id="oDaily" style="margin-top:12px;font-size:30px" class="stars"></div>
    <div class="metaRow"><span id="oXpTxt"></span><span id="oNext"></span></div>
    <div class="bar xp"><i id="oXpBar"></i></div>
    <button class="bigbtn" id="replay"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    <div class="row2">
      <button class="lbtn" id="oShare"><svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>Share score</button>
      <button class="lbtn gold" id="oChallenge"><svg viewBox="0 0 24 24"><path d="M3 2h3l9 9-3 3-9-9zm18 0v3l-9 9-3-3 9-9zM5 15l4 4-2 2-1-1-2 2-2-2 2-2-1-1zm14 0 2 2-1 1 2 2-2 2-2-2-1 1-2-2z"/></svg>Challenge a friend</button>
    </div>

 burst(c.x,c.y,'#ffd60a',18,.4);burst(c.x,c.y,'#ffffff',10,.35);say(auto?'SWAPPED!':'SWAP!',Math.max(L.cell*2.6,Math.min(W-L.cell*2.6,c.x)),c.y-L.cell*.9,L.cell*.62,'#ffd60a',{life:1100});
 SFX.earn();buzz([15,30,15]);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
 window.__lastAutoSwap={auto,ms:Math.round(performance.now()-stuckAt0)}}
let stuckAt0=0;
function addSwapMeter(v){
 if(swaps>=MAXS){meter=100;updateSwapUI();return}
 meter+=v;let got=0;
 while(meter>=100&&swaps<MAXS){meter-=100;swaps++;got++}
 if(swaps>=MAXS)meter=100;
 if(got){const b=$('#swapBtn'),cx=L.swap.x+32,cy=L.swap.y+32;
  setTimeout(()=>{b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');burst(cx,cy,'#ffd60a',14,.3);burst(cx,cy,'#5ee7ff',10,.3);say('+'+got,cx,cy-44,L.cell*.55,'#ffd60a');SFX.earn();buzz(20)},350);
  if(!store.swapHint){store.swapHint=true;setTimeout(()=>toast(IC.swap+' SWAP READY: TAP IT, THEN A PIECE'),800)}}
 updateSwapUI()}
function doSwap(i){
 if(swaps<=0||!tray[i]||state!=='play')return;
 const old=tray[i].p,r=srng;let np=null,first=null;
 for(let t=0;t<120;t++){const p=randPiece(r);if(p===old)continue;if(!first)first=p;if(anyFit(p)){np=p;break}}
 if(!np){const fit=PIECES.filter(p=>p!==old&&anyFit(p));if(fit.length)np=fit[Math.floor(r()*fit.length)]}
 np=np||first||randPiece(r);
 tray[i]={p:np,c:Math.floor(r()*7),born:now,swapT:now};
 swaps--;armed=false;if(kb&&kb.i===i)kb=null;idleReset();
 const c=slotCenter(i);burst(c.x,c.y,TH.cols[tray[i].c],12,.3);SFX.swap();buzz(12);
 if(meter>=100&&swaps<MAXS)meter=0;
 stuckShown=false;checkStuck();updateSwapUI();save()}
function checkStuck(){

 if(swaps>0){if(!stuck){stuck=true;stuckAt0=performance.now();SFX.bad();buzz([20,40,20])}updateSwapUI();return}
 stuck=false;updateSwapUI();endGame('space')}

function updateModeTag(){
 const hearts=()=>{let h='';for(let k=0;k<3;k++)h+=`<span class="heart ${k<strikes?'':'off'}">${IC.heart}</span>`;return h};
 if(challenge){$('#modeTag').innerHTML=IC.swords+' BEAT '+fmt(challenge.score)+(mode==='speed'?' '+hearts():'');return}
 if(mode==='daily')$('#modeTag').innerHTML='DAILY · '+IC.star+' '+fmt(dailyTarget);
 else if(mode==='speed'){let h='';for(let k=0;k<3;k++)h+=`<span class="heart ${k<strikes?'':'off'}">${IC.heart}</span>`;$('#modeTag').innerHTML=IC.bolt+' SPEED '+h}
 else $('#modeTag').textContent=''}
function strike(){
 strikes--;combo=0;since=0;setMusicLevel(0);shake=16;flash=.3;flashCol='#ff2e4d';SFX.strike();buzz([40,30,40]);updateModeTag();
 say(strikes>0?'TIME!':'TIME UP',L.bx+L.S/2,L.by+L.S/2,L.cell*.9,'#ff6b85',{life:1000});
 if(strikes<=0){speedT=0;endGame('time')}else{speedMax=speedFor(score);speedT=speedMax;lastTick=99}}

function startGame(m,opt={}){
 unlockAudio();mode=m;challenge=opt.challenge||null;chalWon=false;
 gameSeed=(opt.seed!=null?opt.seed:m==='daily'?hashStr('bloom-'+today()):(Math.random()*4294967296))>>>0;
 drng=mulberry32(gameSeed);srng=mulberry32(gameSeed^0x9e3779b9);grng=mulberry32(gameSeed^0x51f7a3c1);
 dealN=0;gift=null;clearsN=0;nextGift=3+Math.floor(grng()*2);mult2=0;perfects=0;newBestHit=false;board=emptyBoard();score=0;shown=0;scoreEl.textContent='0';combo=0;since=0;celebrated=false;maxComboRun=0;linesRun=0;
 particles=[];fx=[];texts=[];drag=null;kb=null;ghost=null;
 if(m==='daily'){
  dailyTarget=1500+Math.floor(drng()*11)*100;
  // seeded symmetric "garden" pattern so each day looks distinct
  const cnt=4+Math.floor(drng()*3);
  for(let k=0;k<cnt;k++){const x=Math.floor(drng()*4),y=Math.floor(drng()*N),c=Math.floor(drng()*7);board[y][x]={c,t:-1e9};board[y][N-1-x]={c,t:-1e9}}
 }
 swaps=1;meter=0;armed=false;stuck=false;strikes=3;idleReset();speedMax=speedFor(0);speedT=speedMax;lastTick=99;
 mus.speed=m==='speed';setMusicTempo(m==='speed'?128:118);
 updateModeTag();updateSwapUI();
 dealTray();
 state='play';hideAll();setMusicMode('play');setMusicLevel(0);musTargets();
 hint=!store.seenHint&&tray[0]?findMove(tray[0].p):null;
 store.games++;save();updateBest();
}
function endGame(reason){
 mus.speed=false;setMusicTempo(118);setMusicMode('calm');state='ending';endT=now;drag=null;kb=null;armed=false;stuck=false;updateSwapUI();
 endReason=reason;
 if(reason==='idle'){say('OUT OF TIME',L.bx+L.S/2,L.by+L.S/2,L.cell*.75,'#ffb3c1',{life:1100,rise:0});shake=8}
 else if(reason!=='time')setTimeout(()=>{say('NO SPACE',L.bx+L.S/2,L.by+L.S/2,L.cell*.8,'#fff',{life:900,rise:0})},100);
 SFX.over();buzz([30,40,30]);
 setTimeout(showOver,1250);
}
let endReason='';
function stars(s){if(!dailyTarget)return 0;return s>=dailyTarget*1.6?3:s>=dailyTarget?2:s>=dailyTarget*.5?1:0}
function starHtml(k){let h='';for(let i=0;i<3;i++)h+=`<span class="${i<k?'':'off'}">${IC.star}</span>`;return h}
function showOver(){
 state='over';
 const prev=bestNow();const isBest=score>prev&&score>0;wasBest=isBest;
 if(mode==='daily'&&!challenge){
  const t=today();if(store.dailyDate!==t){store.dailyDate=t;store.dailyBest=0}
  store.dailyBest=Math.max(store.dailyBest,score);
  if(store.dailyLast!==t){store.dailyStreak=store.dailyLast===yesterday()?store.dailyStreak+1:1;store.dailyLast=t}
 }else if(mode==='daily'){}
 else if(mode==='speed')store.bestSpeed=Math.max(store.bestSpeed||0,score);
 else store.best=Math.max(store.best,score);
 store.bestCombo=Math.max(store.bestCombo,maxComboRun);save();
 $('#oRibbon').style.display=isBest?'inline-block':'none';
 const rs=$('#oReason');rs.innerHTML=endReason==='space'?'No space left':IC.clock+' Out of time';rs.className=endReason==='space'?'':'time';
 $('#oBestV').textContent=fmt(Math.max(prev,score));
 // count-up
 const t0=performance.now(),el=$('#oScore');(function cu(){const k=Math.min(1,(performance.now()-t0)/700);el.textContent=fmt(score*ease(k));if(k<1)requestAnimationFrame(cu)})();
 // honest "how close" bar
 const near=$('#oNear');
 if(!isBest&&prev>0){near.style.display='block';$('#oNearBar').style.width='0';setTimeout(()=>$('#oNearBar').style.width=Math.min(100,score/prev*100)+'%',60);
  $('#oNearTxt').innerHTML=score/prev>=.8?`SO CLOSE! −${fmt(prev-score)}`:`${Math.round(score/prev*100)}% of <svg viewBox="0 0 24 24" style="color:#ffd60a"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg>`}
 else near.style.display='none';
 const dd=$('#oDaily');
 if(mode==='daily'){dd.style.display='block';dd.innerHTML=starHtml(stars(score))+`<div style="font-size:14px;font-weight:900;color:#fff;margin-top:2px"><span class="flame">${IC.flame}</span> ${store.dailyStreak}</div>`}else dd.style.display='none';
 $('#oShare').style.display='flex';
 const oc=$('#oChal');if(challenge){const d=score-challenge.score;oc.style.display='block';oc.className=d>0?'win':'lose';oc.innerHTML=IC.swords+(d>0?` YOU WIN! +${fmt(d)}`:d===0?' DRAW!':` ${fmt(-d)} TO WIN`)}else oc.style.display='none';
 // xp toward next theme
 const nx=THEMES.find(t=>t.need>store.xp);
 if(nx){const pv=THEMES[THEMES.indexOf(nx)-1].need;$('#oXpTxt').innerHTML=`${IC.gift} ${store.xp-pv} / ${nx.need-pv}`;$('#oNext').innerHTML=nx.name+' '+swHtml(nx);
  $('#oXpBar').style.width='0';setTimeout(()=>$('#oXpBar').style.width=((store.xp-pv)/(nx.need-pv)*100)+'%',80)}
 else{$('#oXpTxt').innerHTML=IC.gift+' ALL THEMES';$('#oNext').textContent='';$('#oXpBar').style.width='100%'}
 show('#over');
 if(isBest)confetti(100);
}

function buildTitle(){
 const word=[['B','L','O','K'],['A','H','O','L','I','C']];
 $('#logo').innerHTML=word.map((r,ri)=>'<div class="row">'+r.map((ch,i)=>`<div class="tile" style="background:${TH.cols[(i+ri*3)%7]};animation-delay:${(i+ri*5)*.09}s">${ch}</div>`).join('')+'</div>').join('');

 $('#dInfo').innerHTML=`<span class="flame">${IC.flame}</span>${streak} <span class="stars">${starHtml(stars(db))}</span>`;

/* ---------------- input ---------------- */
function updateGhost(){
 if(!drag||!tray[drag.i]){ghost=null;return}
 const sh=tray[drag.i].p,c=L.cell,lift=drag.touch?c*1.4:0;
 const fx0=(drag.x-sh.wd*c/2-L.bx)/c,fy0=(drag.y-lift-sh.ht*c/2-L.by)/c;
 let best=null,bd=.75;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const gx=Math.round(fx0)+dx,gy=Math.round(fy0)+dy;const d=Math.hypot(gx-fx0,gy-fy0);if(d<bd&&fits(sh,gx,gy)){bd=d;best={gx,gy}}}
 if((!ghost&&best)||(ghost&&best&&(ghost.gx!==best.gx||ghost.gy!==best.gy)))tone(1200,.02,'sine',.03);
 ghost=best}
cv.addEventListener('pointerdown',e=>{
 unlockAudio();if(state!=='play')return;
 const i=slotAt(e.clientX,e.clientY);
 if(armed){if(i>=0&&tray[i])doSwap(i);else{armed=false;updateSwapUI()}return}
 if(i<0||!tray[i])return;
 kb=null;drag={i,x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse',id:e.pointerId};tray[i].ret=null;
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 SFX.pick();updateGhost();e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.x=e.clientX;drag.y=e.clientY;updateGhost()});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
 if(ghost&&tray[d.i]&&state==='play'){place(d.i,ghost.gx,ghost.gy)}
 else if(tray[d.i]){tray[d.i].ret={x:d.x,y:d.y-(d.touch?L.cell*1.4:0),t:now};const onBoard=d.x>L.bx&&d.x<L.bx+L.S&&d.y>L.by&&d.y<L.by+L.S+L.cell;if(onBoard)SFX.bad()}
 ghost=null}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='m'||k==='M'){const any=!store.muted||store.music;store.muted=any;store.music=!any;save();unlockAudio();setMute();SFX.click();return}
 if(state==='title'){if(k==='Enter'||k===' '){e.preventDefault();startGame('classic')}else if(k==='d'||k==='D')startGame('daily');else if(k==='s'||k==='S')startGame('speed');return}
 if(state==='over'){if(k==='Enter'||k===' '||k==='r'||k==='R'){e.preventDefault();$('#replay').click()}else if(k==='Escape')goHome();return}
 if(state!=='play')return;
 if(stuck&&swaps>0&&(k==='Enter'||k===' ')){e.preventDefault();autoSwap(false);return}
 if(k==='Escape'){if(armed){armed=false;updateSwapUI()}else if(kb)kb=null;else goHome();return}
 if(k==='s'||k==='S'){if(swaps<=0){SFX.bad();return}if(kb){doSwap(kb.i);return}armed=!armed;SFX.click();updateSwapUI();return}
 if(k==='1'||k==='2'||k==='3'){const i=+k-1;if(!tray[i])return;if(armed){doSwap(i);return}const sh=tray[i].p;const m=findMove(sh);kb={i,gx:m?m.gx:Math.floor((N-sh.wd)/2),gy:m?m.gy:Math.floor((N-sh.ht)/2)};SFX.pick();return}
 if(!kb&&(k.startsWith('Arrow')||k==='Enter'||k===' ')){const i=tray.findIndex(t=>t&&anyFit(t.p));if(i<0)return;const m=findMove(tray[i].p);kb={i,gx:m.gx,gy:m.gy};SFX.pick();e.preventDefault();return}
 if(!kb)return;const sh=tray[kb.i].p;
 const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
 if(mv){e.preventDefault();kb.gx=Math.max(0,Math.min(N-sh.wd,kb.gx+mv[0]));kb.gy=Math.max(0,Math.min(N-sh.ht,kb.gy+mv[1]));tone(900,.02,'sine',.04);return}
 if(k==='Tab'){e.preventDefault();for(let s=1;s<=3;s++){const j=(kb.i+s)%3;if(tray[j]){kb.i=j;const t=tray[j].p;kb.gx=Math.min(kb.gx,N-t.wd);kb.gy=Math.min(kb.gy,N-t.ht);break}}return}
 if(k==='Enter'||k===' '){e.preventDefault();if(fits(sh,kb.gx,kb.gy)){const i=kb.i,gx=kb.gx,gy=kb.gy;kb=null;place(i,gx,gy)}else SFX.bad()}
});
addEventListener('resize',()=>layout());

/* ---------------- test hooks (read-only helpers) ---------------- */
window.BB={state:()=>({state,mode,score,combo,best:bestNow(),swaps,meter,stuck,stuckShown,stuckLeft:Math.round(stuckLeft),lastAutoSwap:window.__lastAutoSwap||null,armed,strikes,seed:gameSeed,mult2,gift:gift&&{type:gift.type,label:gift.label||''},clearsN,nextGift,skin:SKIN,skins:store.skins.slice(),challenge,speedT:Math.round(speedT),idleT:Math.round(idleT),idlePaused:idlePaused(),endReason,speedMax:Math.round(speedMax),tray:tray.map(t=>t&&{w:t.p.wd,h:t.p.ht,n:t.p.cells.length}),filled:board.flat().filter(Boolean).length}),
 move:i=>tray[i]?findMove(tray[i].p):null,
 firstMove:i=>{if(!tray[i])return null;const sh=tray[i].p;for(let y=0;y<=N-sh.ht;y++)for(let x=N-sh.wd;x>=0;x--)if(fits(sh,x,y)&&!linesFor(sh,x,y).rows.length&&!linesFor(sh,x,y).cols.length)return{gx:x,gy:y};return findMove(sh)},
 dropPoint:(i,gx,gy,touch)=>{const sh=tray[i].p,c=L.cell;return{x:L.bx+(gx+sh.wd/2)*c,y:L.by+(gy+sh.ht/2)*c+(touch?c*1.4:0)}},
 slot:i=>slotCenter(i),
 swapPoint:()=>({x:L.swap.x+32,y:L.swap.y+32}),
 // test-only: build a stuck board (isolated diagonal holes, 3x3 pieces) with n swaps banked
 dev:{stuck(n){for(let y=0;y<N;y++)for(let x=0;x<N;x++)board[y][x]=x===y?null:{c:(x+y)%7,t:-1e9};tray=[0,1,2].map(()=>({p:PIECES.find(p=>p.cells.length===9),c:1,born:now}));swaps=n;meter=0;stuck=false;checkStuck()},
  fill(v){addSwapMeter(v)},idle(ms){idleT=ms;idleSec=99;idleSince=0},gift(t){openGift(t)}},
 challengeLink:()=>challengeLink(),
 texts:()=>texts.map(t=>t.s),
 card:()=>makeCard().toDataURL('image/png'),
 music:()=>({on:mus.on,mode:mus.mode,level:mus.level,ctx:AC?AC.state:'none',layers:Object.fromEntries(LAYERS.map(k=>[k,mus.tgt[k]])),enabled:store.music,sfx:!store.muted,speed:mus.speed,bpm:Math.round(60/SPB/4)})};

try{const q=new URLSearchParams(location.search).get('c');if(q){const [a,b,c]=q.split('-'),m={c:'classic',d:'daily',s:'speed'}[b],sd=parseInt(a,36),sc=parseInt(c,36);if(m&&sd>=0&&sc>=0&&sd<=4294967295)pendingChal={seed:sd>>>0,mode:m,score:sc}}}catch(e){}
document.body.classList.add('menu');setMute();layout();buildTitle();requestAnimationFrame(frame);
})();
